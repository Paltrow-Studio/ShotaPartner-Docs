    <script>
      // 主题在首屏绘制前定好，避免白闪 / 黑闪。
      // 优先级：localStorage 中用户显式选择 > 按国内时间（Asia/Shanghai）判定的默认值。
      // 时段与 src/lib/theme.ts 的 DAY_START_HOUR / DAY_END_HOUR 必须一致：06:00~17:59 日间，其余夜间。
      ;(function () {
        var COLORS = { light: '#f3eee2', dark: '#191713' }
        function chinaHour() {
          try {
            var parts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'Asia/Shanghai',
              hour: '2-digit',
              hour12: false,
            }).formatToParts(new Date())
            for (var i = 0; i < parts.length; i++) {
              if (parts[i].type === 'hour') return Number(parts[i].value) % 24
            }
          } catch (e) {
            /* 缺少时区数据时用固定偏移 */
          }
          return (new Date().getUTCHours() + 8) % 24
        }
        var theme
        try {
          var saved = localStorage.getItem('sp-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (e) {
          /* 隐私模式下读不到，按时间判定 */
        }
        if (!theme) {
          var hour = chinaHour()
          theme = hour >= 6 && hour < 18 ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', COLORS[theme])
      })()
    </script>
