# 伙伴物语 / Partner Monogatari —— 崩溃与启动失败（Issue Form）
#
# 适用场景：无法进入或直接崩溃
# 适用范围：无法进入或直接崩溃 —— 崩溃、无法启动、卡在加载界面、进入世界后立即退出。
# 不适用：
#   - 功能异常但不崩溃 -> 使用「缺陷报告」模板
#   - 与其它模组、整合包、专用服务端相关 -> 使用「兼容性 / 服务端 / 整合包」模板
#
# 维护提示：本表单与站点反馈区严格同步，字段标签与顺序、类型名称与描述、
# 涉及模块选项、提交前自检条目、不予受理的情况，全部以站点为准。
# 站点数据在 src/data/feedback.ts，改动任意一边后请运行 `npm run check:feedback`
# （已挂在 `npm run build` 上）确认两边一致。
# labels 必须已经存在于本仓库，否则 GitHub 会忽略该标签。

name: 崩溃与启动失败
description: "无法进入或直接崩溃。崩溃、无法启动、卡在加载界面、进入世界后立即退出。"
title: "[崩溃] "
labels: ["crash", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        适用场景：无法进入或直接崩溃。

  - type: dropdown
    id: module
    attributes:
      label: "涉及模块"
      description: "请选择最可能出问题的一个模块；完全不确定就选最后一项，我们会帮忙判断。"
      options:
        - "ShotaPartner-Core（游戏本体：伙伴/技能/战斗/物品/方块）"
        - "ShotaPartner-API（公共前置 API）"
        - "ShotaPartner-Extra-School（学校维度追加包）"
        - "不确定 / 与多个模块都有关"
    validations:
      required: true

  - type: checkboxes
    id: preflight
    attributes:
      label: "提交前自检"
      description: "与站点反馈区「提交前需准备的信息」逐条对应，请确认后再提交。"
      options:
        - label: "完整的模组列表：mods 目录下所有 jar 的文件名；使用整合包时写明整合包名称与版本"
          required: true
        - label: "复现步骤：按步骤可以复现问题；若不确定是否必然出现，请一并说明"
          required: true
        - label: "日志链接：完整日志已上传 mclo.gs 或 Gist，issue 中仅贴相关的数十行"
          required: true
        - label: "截图或录屏：界面错位、渲染异常、学校缺少装饰这类问题已准备附图"
          required: false
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 不予受理的情况

        - 整份 latest.log 不要粘贴到 issue 中，提供链接即可。
        - 提交前先搜索已有 issue（含已关闭的），同类问题在原帖下跟进。
        - 如何安装、如何游玩这类问题请发至讨论区，issue 区用于可复现的问题与具体建议。
        - issue 内容公开，请勿包含服务器地址、联系方式等个人信息。

  - type: dropdown
    id: crash_stage
    attributes:
      label: "崩溃阶段"
      description: "崩溃出现在哪一个阶段？这一项能帮我们快速缩小范围。"
      options:
        - "启动时（还没到主菜单）"
        - "进入世界或服务器时"
        - "世界中运行时"
        - "退出游戏或服务器时"
        - "不确定"
    validations:
      required: true

  - type: input
    id: crash_link
    attributes:
      label: "崩溃报告 / 日志链接"
      description: "把 crash-reports/ 下的崩溃报告（或 latest.log）上传到 mclo.gs 或 Gist 后贴链接；崩溃报告比 latest.log 重要得多。若游戏目录或服务端根目录出现了 hs_err_pid*.log，请在补充说明里写明，那是 JVM 层面的崩溃，处理方式不同。"
      placeholder: "https://mclo.gs/xxxxxxxx"
    validations:
      required: true

  - type: textarea
    id: stack_head
    attributes:
      label: "崩溃栈关键片段"
      description: "只贴从 Description: 开始、到第一个本模组的 at ... 帧为止的部分即可，不要把整个崩溃报告贴进来。"
      render: text
      placeholder: |
        Description: Rendering screen
        java.lang.NullPointerException: Cannot invoke ...
        at com.paltrow.shotapartner.core....(CrashReport.java:123)
    validations:
      required: true

  - type: input
    id: suspect_mod
    attributes:
      label: "报告指出的可疑模组"
      description: "崩溃报告里若有「Suspect Mods」或类似的指引行，请照抄在这里；没有就留空。"
      placeholder: "例如：shota_partner_api 或 无"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 环境

        环境和版本信息决定了问题能否复现。请填写准确，不要只写「最新版」。

  - type: input
    id: mod_version
    attributes:
      label: "模组版本"
      description: "见发布页的版本号，或 Mods 列表里显示的文件版本号。（例如：0.3.1）"
      placeholder: "0.3.1"
    validations:
      required: true

  - type: input
    id: forge_version
    attributes:
      label: "Forge 版本"
      description: "必须是 Minecraft 1.20.1 对应的 Forge 47.x。（例如：47.4.23）"
      placeholder: "47.4.23"
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: "运行环境"
      description: "问题出现在哪一种运行方式下？如果都出现，请选「以上都有」。"
      options:
        - "单人游戏（客户端）"
        - "专用服务端（dedicated server）"
        - "局域网联机（客户端作主机）"
        - "以上都有"
    validations:
      required: true

  - type: dropdown
    id: java_version
    attributes:
      label: "Java 版本"
      description: "Minecraft 1.20.1 需要 Java 17。用 Java 8 / 11 会直接启动失败，用 Java 21 也可能出现兼容问题。"
      options:
        - "17"
        - "18"
        - "21"
        - "其它（请在补充说明里写明）"
        - "不确定"
    validations:
      required: true

  - type: dropdown
    id: pack
    attributes:
      label: "是否使用整合包"
      description: "这一步能帮我们快速判断问题是否来自模组之间的相互影响。"
      options:
        - "不使用（自己装的模组）"
        - "使用整合包"
    validations:
      required: true

  - type: textarea
    id: mod_list
    attributes:
      label: "模组列表"
      description: "自己装模组请完整列出 mods 目录下的文件名（含前置）；使用整合包请给出整合包名称与版本。"
      placeholder: |
        不使用整合包时，请粘贴 mods 目录下的文件名，例如：
        shotapartner-core-0.3.1.jar
        shota_partner_api-0.3.1.jar
        geckolib-forge-1.20.1-4.4.9.jar
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "复现步骤"
      description: "从启动游戏到问题出现的最短操作路径，一步一步写清楚（步骤越短、越确定，定位越快）。"
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "期望结果"
      description: "你认为正常情况下应该发生什么？"
      placeholder: "例如：技能「烈焰斩」在 3 级时应造成 12 点伤害。"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "实际结果"
      description: "实际发生了什么？有具体数值、截图或时间点请一并写清楚。"
      placeholder: "例如：实际只造成 8 点伤害，且面板显示仍为 1 级数值。"
    validations:
      required: true

  - type: dropdown
    id: repro_rate
    attributes:
      label: "复现频率"
      description: "按实际感受选择即可，这项会影响我们的优先级排序。"
      options:
        - "每次都能复现"
        - "经常（>50%）"
        - "偶尔（<50%）"
        - "只遇到过一次"
    validations:
      required: true

  - type: dropdown
    id: isolation
    attributes:
      label: "最小环境验证"
      description: "只装本模组与必需前置时，问题还在吗？这一步能排除绝大部分「其实是别的模组导致的」情况。"
      options:
        - "是，最小环境下仍能复现"
        - "否，只在加了其它模组或整合包时出现"
        - "还没试过"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: "补充说明"
      description: "任何上面没问到、但你觉得可能有帮助的信息（hs_err_pid 文件、启动参数、自定义配置等）。"
    validations:
      required: false
