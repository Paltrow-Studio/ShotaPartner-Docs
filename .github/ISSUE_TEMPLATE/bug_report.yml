# 伙伴物语 / Partner Monogatari —— 缺陷报告（Issue Form）
#
# 适用范围：能正常进入游戏，但某个功能的行为不对（数值错误、逻辑异常、UI 错位、交互失效等）。
# 不适用：
#   - 崩溃 / 启动失败  -> 使用「💥 崩溃与启动失败」模板
#   - 与其它模组、整合包、专用服务端相关 -> 使用「🧩 兼容性 / 服务端 / 整合包」模板
#   - 提问 / 玩法交流 / 不确定是不是 bug -> 走 Discussions
#
# 维护提示：labels 必须已经存在于本仓库，否则 GitHub 会忽略该标签。

name: 🐛 缺陷报告
description: 游戏能正常进入，但某个功能行为不对（数值错误、逻辑异常、UI 错位、交互失效等）
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  # ---------- 模块定位 ----------
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      description: 请选择最可能出问题的一个模块；完全不确定就选最后一项，我们会帮忙判断。
      options:
        - ShotaPartner-Core（游戏本体：伙伴/技能/战斗/物品/方块）
        - ShotaPartner-API（公共前置 API）
        - ShotaPartner-Extra-School（学校维度追加包）
        - 不确定 / 与多个模块都有关
    validations:
      required: true

  # ---------- 提交前自检 ----------
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前自检
      description: 请逐条确认后再提交；未确认的条目会让 issue 被直接关闭而浪费双方时间。
      options:
        - label: 已阅读仓库 README 与站点常见问题，并搜索过已有 issue（含已关闭的）
          required: true
        - label: 使用的是最新版本，且问题可以稳定重现
          required: true
        - label: 已确认日志里没有「缺少前置 shota_partner_api」这类依赖错误
          required: true
    validations:
      required: true

  # ---------- 环境 ----------
  - type: markdown
    attributes:
      value: |
        ## 环境

        环境和版本信息决定了我们能不能复现问题。请尽量填写准确，不要只写「最新版」。

  - type: input
    id: mod_version
    attributes:
      label: 模组版本
      description: "见发布页的版本号，或 Mods 列表里显示的文件版本号。（例如：0.3.1）"
      placeholder: 0.3.1
    validations:
      required: true

  - type: input
    id: forge_version
    attributes:
      label: Forge 版本
      description: "必须是 Minecraft 1.20.1 对应的 Forge 47.x。（例如：47.4.23）"
      placeholder: 47.4.23
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: 运行环境
      description: 问题出现在哪一种运行方式下？如果都出现，请选「以上都有」。
      options:
        - 单人游戏（客户端）
        - 专用服务端（dedicated server）
        - 局域网联机（客户端作主机）
        - 以上都有
    validations:
      required: true

  - type: dropdown
    id: java_version
    attributes:
      label: Java 版本
      description: "Minecraft 1.20.1 需要 Java 17。用 Java 8 / 11 会直接启动失败，用 Java 21 也可能出现兼容问题。"
      options:
        - "17"
        - "18"
        - "21"
        - 其它（请在补充说明里写明）
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: pack
    attributes:
      label: 是否使用整合包
      description: 这一步能帮我们快速判断问题是否来自模组之间的相互影响。
      options:
        - 不使用（自己装的模组）
        - 使用整合包
    validations:
      required: true

  - type: textarea
    id: mod_list
    attributes:
      label: 模组列表
      description: 自己装模组请完整列出 mods 目录下的文件名（含前置）；使用整合包请给出整合包名称与版本。
      placeholder: |
        不使用整合包时，请粘贴 mods 目录下的文件名，例如：
        shotapartner-core-0.3.1.jar
        shota_partner_api-0.3.1.jar
        geckolib-forge-1.20.1-4.4.9.jar
    validations:
      required: true

  # ---------- 复现 ----------
  - type: markdown
    attributes:
      value: |
        ## 复现

        步骤越短、越确定，定位越快。请写「从启动游戏开始」的最少步骤。

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动游戏到问题出现的最短操作路径，一步一步写清楚。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你认为正常情况下应该发生什么？
      placeholder: 例如：技能「烈焰斩」在 3 级时应造成 12 点伤害。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么？有具体数值、截图或时间点请一并写清楚。
      placeholder: 例如：实际只造成 8 点伤害，且面板显示仍为 1 级数值。
    validations:
      required: true

  - type: dropdown
    id: repro_rate
    attributes:
      label: 复现频率
      description: 按实际感受选择即可，这项会影响我们的优先级排序。
      options:
        - 每次都能复现
        - 经常（>50%）
        - 偶尔（<50%）
        - 只遇到过一次
    validations:
      required: true

  - type: dropdown
    id: isolation
    attributes:
      label: 最小环境验证
      description: 只装本模组与必需前置时，问题还在吗？这一步能排除绝大部分「其实是别的模组导致的」情况。
      options:
        - 是，最小环境下仍能复现
        - 否，只在加了其它模组或整合包时出现
        - 还没试过
    validations:
      required: true

  # ---------- 日志与截图 ----------
  - type: markdown
    attributes:
      value: |
        ## 日志与截图

        ⚠️ 不要把整个日志粘贴进 issue，请上传到 mclo.gs 或 Gist 后贴链接

        日志文件位置：`.minecraft/logs/latest.log`（客户端）或服务端根目录的 `logs/latest.log`。

  - type: input
    id: log_link
    attributes:
      label: 完整日志链接
      description: 把 latest.log 上传到 mclo.gs 或 Gist，然后把链接贴在这里。
      placeholder: https://mclo.gs/xxxxxxxx
    validations:
      required: false

  - type: textarea
    id: log_excerpt
    attributes:
      label: 相关日志片段
      description: 只贴与问题直接相关的几十行（不要贴整个日志），方便我们快速定位。
      render: text
      placeholder: |
        [12:34:56] [Render thread/ERROR] [shota_partner/]: ...
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: 截图 / 录屏
      description: 图片可以直接拖进输入框；录屏请贴链接。
      placeholder: 把截图直接拖到这里即可。
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 任何上面没问到、但你觉得可能有帮助的信息（Java 版本说明、自定义配置、改动过的数据包等）。
    validations:
      required: false
