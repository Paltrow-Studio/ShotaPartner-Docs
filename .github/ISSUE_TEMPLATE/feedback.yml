# 伙伴物语 / Partner Monogatari —— 反馈（唯一的 Issue 表单）
#
# 玩家只需要填四项：标题、版本、内容、截图（可选）。
# 问题属于哪一类、涉及哪个模块，由维护者看内容判断并补标签，不再要求玩家选择。
#
# 维护提示：本表单由 src/data/feedback.ts 生成，请不要手改字段文案。
#   改站点数据后运行 `node scripts/check-feedback-sync.mjs --write` 重新生成，
#   `npm run build`（含 npm run check:feedback）会校验两边一致。
# labels 必须已存在于本仓库（needs-triage），否则 GitHub 会静默忽略。

name: 反馈
description: "一个问题、一条建议：填标题、版本、内容，有截图就附上。"
title: "[反馈] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        不用先读一长串规则：把下面三项填完就可以提交，有截图顺手拖进来。

  - type: dropdown
    id: version
    attributes:
      label: "版本"
      description: "在游戏里看到的本体版本号；拿不准就选「不确定」，在内容里写明也行。"
      options:
        - "0.3.1（当前版本）"
        - "整合包内附带的版本（请在内容里写明）"
        - "更早的版本（请在内容里写明）"
        - "不确定"
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: "内容"
      description: "发生了什么、怎么重现、你希望是什么结果。例如：伙伴在工作时不会拾取掉落物，站着不动也一直触发工作动画。"
      placeholder: "发生了什么 / 怎么重现 / 你希望是什么结果"
    validations:
      required: true

  - type: upload
    id: media
    attributes:
      label: "截图 / 录屏"
      description: "截图或录屏在 GitHub 的表单里拖进上传框即可（图片 10 MB 以内）。"

  - type: markdown
    attributes:
      value: |
        ## 提交须知

        - 日志不要整份贴进内容里：先传到 mclo.gs 或 Gist，把链接写在内容里。
        - 同一类问题先看进度区与已有反馈，在原来那条下面补充，比新开一条更容易被处理。
