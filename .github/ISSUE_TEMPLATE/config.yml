# 伙伴物语 / Partner Monogatari —— Issue 模板总配置
#
# 维护者请先读：
#   1. 反馈的**首选入口**仍是反馈区（feedback.html）：不需要账号，填标题 / 版本 /
#      内容（可选截图）即可，数据由自建反馈服务（service/）保存。
#   2. feedback.yml 是给「本来就在 GitHub 上」的人留的可选入口：在这里开的 issue
#      会被反馈服务的 issue 同步（service/github.mjs）识别「反馈」标签并导入反馈区，
#      编号与进度随后以反馈区为准。表单里的「联系方式」没有做——**issue 全文公开**，
#      需要回访请到反馈区填写。
#   3. blank_issues_enabled: false 是有意为之：空白 issue 不带「反馈」标签，
#      不会被同步导入，只作维护者内部记录。
#   4. 三个模组仓库（ShotaPartner-Core / ShotaPartner-API / ShotaPartner-Extra-School）目前是私有的。

blank_issues_enabled: false
contact_links:
  - name: 反馈区：提交反馈 / 查看进度 / 全部记录
    url: https://paltrow-studio.github.io/ShotaPartner-Docs/feedback.html
    about: 不需要 GitHub 账号。填标题、版本、内容，有截图就拖进来，提交后拿到编号
  - name: 玩法说明文档
    url: https://paltrow-studio.github.io/ShotaPartner-Docs/
    about: 伙伴获取与养成、技能与轮盘、战斗 AI、工作与后勤、学校维度
  - name: 讨论区：提问 / 玩法交流 / 不确定是不是问题
    url: https://github.com/Paltrow-Studio/ShotaPartner-Docs/discussions
    about: 安装与配置类提问、玩法讨论请走 Discussions
