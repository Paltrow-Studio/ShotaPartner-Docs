    <meta property="og:type" content="website" />

    <meta property="og:title" content="反馈区 · 伙伴物语 Partner Monogatari" />

      property="og:description"
      content="不需要账号：填标题、版本、内容，可选附截图，提交后拿到编号并在进度区跟踪。"
    />

    <script>
      // 主题在首屏绘制前定好，避免白闪 / 黑闪。判定规则与 index.html、
      // src/lib/theme.ts 完全一致：localStorage 中的显式选择优先，否则按国内时间。
      ;(function () {
        var COLORS = { light: '#f3eee2', dark: '#191713' }
        function chinaHour() {
          try {
            var parts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'Asia/Shanghai',
              hour: '2-digit',
              hour12: false,
            }).formatToParts(new Date())
            for (var i = 0; i < parts.length; i++) {
              if (parts[i].type === 'hour') return Number(parts[i].value) % 24
            }
          } catch (e) {
            /* 缺少时区数据时用固定偏移 */
          }
          return (new Date().getUTCHours() + 8) % 24
        }
        var theme
        try {
          var saved = localStorage.getItem('sp-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (e) {
          /* 隐私模式下读不到，按时间判定 */
        }
        if (!theme) {
          var hour = chinaHour()
          theme = hour >= 6 && hour < 18 ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', COLORS[theme])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/feedback/main.tsx"></script>
  </body>
