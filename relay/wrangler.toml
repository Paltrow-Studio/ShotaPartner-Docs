# 反馈中继（Cloudflare Worker）部署配置
#
# 用法：
#   cd relay
#   npx wrangler deploy
#   npx wrangler secret put GITHUB_TOKEN
#
# 国内可达性：workers.dev 常被 DNS 污染，请按下文启用自有域名（custom_domain），
# 或用 [env.production] 之外的 routes 绑定已接入 Cloudflare 的域名。

name = "shota-feedback-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

# —— 自有域名（推荐：国内稳定性远好于 workers.dev）——
# 把 relay.example.com 换成你已经托管在 Cloudflare 的子域，
# 首次 deploy 时 Wrangler 会自动建好 DNS 记录与证书。
routes = [{ pattern = "relay.example.com", custom_domain = true }]

[vars]
GITHUB_REPO = "Paltrow-Studio/ShotaPartner-Docs"
ALLOWED_ORIGINS = "https://paltrow-studio.github.io"
RATE_LIMIT_PER_HOUR = "5"
# 一般不需要改；仅在用 GitHub Enterprise 或本地联调时覆盖
# GITHUB_API_BASE = "https://api.github.com"
# 留空表示不校验请求头；设置了请用 npx wrangler secret put RELAY_SECRET 下发
DRY_RUN = ""

# —— 可选：跨节点共享限流计数 ——
# 先建命名空间：npx wrangler kv namespace create RATE_KV
# 再把返回的 id 填进下面，然后取消注释。free 版每天 10 万次读、1000 次写。
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "替换为 wrangler kv namespace create 输出的 id"

[observability]
enabled = true
